additionalProperties:
  formFields:
    - default: 6157
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        ja: HTTP ポート
        ms: Port HTTP
        pt-br: Porta HTTP
        ru: Порт HTTP
        ko: HTTP 포트
        zh: HTTP 端口
        zh-Hant: HTTP 連接埠
      required: true
      rule: paramPort
      type: number

    - default: 2222
      edit: true
      envKey: PANEL_APP_PORT_SSH
      labelEn: SSH Port
      labelZh: SSH 端口
      label:
        en: SSH Port
        ja: SSH ポート
        ms: Port SSH
        pt-br: Porta SSH
        ru: Порт SSH
        ko: SSH 포트
        zh: SSH 端口
        zh-Hant: SSH 連接埠
      required: true
      rule: paramPort
      type: number
      # 用于 git clone/push 的 SSH 访问，端口要和后台「SSH 端口」设置一致（默认 2222）。
      # 不需要 SSH 时可以留空丢弃，只走 HTTP。

    - default: ""
      edit: true
      envKey: QYG_EXTERNAL_URL
      labelEn: External URL
      labelZh: 对外地址
      label:
        en: External URL
        ja: 外部 URL
        ms: URL luaran
        pt-br: URL externa
        ru: Внешний URL
        ko: 외부 URL
        zh: 对外地址
        zh-Hant: 對外位址
      required: false
      type: text
      # 填 https://gist.example.com 这种完整地址，用于生成 clone 链接和第三方登录回调；
      # 留空则按访问时的域名推断，反向代理后面建议填上。
