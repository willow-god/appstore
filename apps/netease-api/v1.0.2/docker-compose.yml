services:
  netease-api:
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:5000"
    image: willowgod/netease-api:latest
    volumes:
      - ./data/cookie.txt:/app/cookie.txt:ro
    labels:  
      createdBy: "Apps"

networks:  
  1panel-network:  
    external: true
