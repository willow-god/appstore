services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.10.3-slim
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    labels:
      createdBy: "Apps"
    ports:
      - "${PANEL_APP_PORT_HTTP}:9999"
      - "${PANEL_APP_PORT_API}:8888"
    environment:
      TZ: Asia/Shanghai

      # ============================================================
      # PostgreSQL（需已安装 pgvector 扩展）
      # ============================================================
      HINDSIGHT_API_DATABASE_URL: postgresql://${PANEL_DB_USER}:${PANEL_DB_USER_PASSWORD}@${PANEL_DB_HOST}:${PANEL_DB_PORT}/${PANEL_DB_NAME}

      # ============================================================
      # 主 LLM：所有操作默认使用；提供商锁定为 openai（OpenAI 兼容协议）
      # 官方 OpenAI、DeepSeek、硅基流动、各类中转等绝大多数服务都提供
      # OpenAI 兼容接口，用 _BASE_URL 指向实际服务即可，无需改这里。
      # 若要用 anthropic / gemini / ollama 等原生协议，改这一行，
      # 并按官方 .env.example 补上该提供商需要的变量。
      # ============================================================
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL}
      # 事实提取单次调用的输出预算，写死 64000（上游默认值，官方要求模型至少能输出 65k）。
      # 模型输出上限较小时会调用失败，此时把这里调低到 32000 / 16000（必须大于 3000）。
      HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS: 64000

      # ============================================================
      # 备用 LLM：主模型报错时按顺序故障转移（只换模型，其余继承主 LLM）
      # 表单里的「备用 LLM」是开关：开 = openai，关 = 空值。
      # provider 为空时上游在读取 API Key 之前就停止扫描，成员根本不存在，
      # 因此"关"的状态不会触发下面的 Key 强校验，也不会创建成员。
      # KEY / BASE_URL 直接引用主 LLM 的值，原因有二：
      #   1) 上游规定成员 provider 非空时其 API Key 不能为空，否则启动抛错；
      #   2) 成员不会继承主 LLM 的 BASE_URL，留空会静默回落到 api.openai.com。
      # 要换成另一家服务商：把下面三行改成具体值（BASE_URL 必须写全）。
      # ============================================================
      HINDSIGHT_API_LLM_1_PROVIDER: ${HINDSIGHT_API_LLM_1_PROVIDER}
      HINDSIGHT_API_LLM_1_API_KEY: ${HINDSIGHT_API_LLM_API_KEY}
      HINDSIGHT_API_LLM_1_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL}
      HINDSIGHT_API_LLM_1_MODEL: ${HINDSIGHT_API_LLM_1_MODEL}
      HINDSIGHT_API_LLM_STRATEGY: '{"mode": "failover"}'

      # ============================================================
      # 嵌入模型：锁定硅基流动
      # 上游没有 siliconflow 这个嵌入提供商（合法值只有 local / onnx / tei /
      # openai / openai-codex / openrouter / requesty / cohere / google /
      # zeroentropy / litellm / litellm-sdk），所以走 OpenAI 兼容接口指向硅基流动。
      # OpenAI SDK 会在 base_url 后自动拼 /embeddings，
      # 即最终请求 https://api.siliconflow.cn/v1/embeddings
      # ============================================================
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: https://api.siliconflow.cn/v1
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS}

      # ============================================================
      # 重排：锁定硅基流动（Cohere 兼容的 /rerank 接口）
      # 不设 _SILICONFLOW_BASE_URL：上游默认值就是 https://api.siliconflow.cn/v1，
      # 客户端再拼上 RERANK_PATH("/rerank")，最终请求
      # https://api.siliconflow.cn/v1/rerank
      # 备注：上游不接受 "none"（会报 Unknown reranker provider），
      # 若要停用重排，把 PROVIDER 改成 rrf（透传实现，不加载模型）
      # ============================================================
      HINDSIGHT_API_RERANKER_PROVIDER: siliconflow
      HINDSIGHT_API_RERANKER_SILICONFLOW_API_KEY: ${HINDSIGHT_API_RERANKER_SILICONFLOW_API_KEY}
      HINDSIGHT_API_RERANKER_SILICONFLOW_MODEL: ${HINDSIGHT_API_RERANKER_SILICONFLOW_MODEL}
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES: ${HINDSIGHT_API_RERANKER_MAX_CANDIDATES}

      # ============================================================
      # 认证：API/MCP 用 API Key，GUI 用独立访问密钥
      # ============================================================
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY}
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_CP_ACCESS_KEY}
      # GUI 通过服务端代理访问数据面 API，这里必须复用上面那把 API Key
      HINDSIGHT_CP_DATAPLANE_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
