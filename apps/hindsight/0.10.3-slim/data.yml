additionalProperties:
  formFields:
    # ============================================================
    # PostgreSQL（需已安装 pgvector 扩展）
    # ============================================================
    - child:
        default: ""
        envKey: PANEL_DB_HOST
        required: true
        type: service
      default: postgresql
      envKey: PANEL_DB_TYPE
      labelEn: Database Service
      labelZh: 数据库服务
      label:
        en: Database Service
        zh: 数据库服务
        zh-Hant: 資料庫服務
      required: true
      type: apps
      values:
        - label: PostgreSQL
          value: postgresql

    - default: hindsight
      envKey: PANEL_DB_NAME
      labelEn: Database Name
      labelZh: 数据库名
      label:
        en: Database Name
        zh: 数据库名
        zh-Hant: 資料庫名
      random: true
      required: true
      rule: paramCommon
      type: text

    - default: hindsight
      envKey: PANEL_DB_USER
      labelEn: Database User
      labelZh: 数据库用户
      label:
        en: Database User
        zh: 数据库用户
        zh-Hant: 資料庫使用者
      random: true
      required: true
      rule: paramCommon
      type: text

    - default: hindsight
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: Database User Password
      labelZh: 数据库用户密码
      label:
        en: Database User Password
        zh: 数据库用户密码
        zh-Hant: 資料庫使用者密碼
      random: true
      required: true
      type: password

    # ============================================================
    # 端口：控制台(GUI) / 数据面 API
    # ============================================================
    - default: 9999
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Control Plane (GUI) Port
      labelZh: 控制台(GUI)端口
      label:
        en: Control Plane (GUI) Port
        zh: 控制台(GUI)端口
        zh-Hant: 控制台(GUI)連接埠
      required: true
      rule: paramPort
      type: number

    - default: 8888
      envKey: PANEL_APP_PORT_API
      labelEn: Dataplane API Port
      labelZh: 数据面 API 端口
      label:
        en: Dataplane API Port
        zh: 数据面 API 端口
        zh-Hant: 資料面 API 連接埠
      required: true
      rule: paramPort
      type: number

    # ============================================================
    # 主 LLM：全部操作默认使用；提供商已锁定为 openai（OpenAI 兼容）于 compose 中
    # ============================================================
    - default: ""
      envKey: HINDSIGHT_API_LLM_API_KEY
      labelEn: LLM API Key
      labelZh: LLM API Key
      label:
        en: LLM API Key
        zh: LLM API Key
        zh-Hant: LLM API Key
      required: true
      type: password

    - default: ""
      envKey: HINDSIGHT_API_LLM_MODEL
      labelEn: LLM Model
      labelZh: LLM 模型
      label:
        en: LLM Model — the model your endpoint actually serves (required)
        zh: LLM 模型 —— 填这个接口真实提供的模型（必填）
        zh-Hant: LLM 模型 —— 填這個介面真實提供的模型（必填）
      required: true
      rule: paramCommon
      type: text

    - default: ""
      envKey: HINDSIGHT_API_LLM_BASE_URL
      labelEn: LLM Base URL
      labelZh: LLM 接口地址
      label:
        en: LLM Base URL (OpenAI-compatible endpoint, ending in /v1)
        zh: LLM 接口地址（OpenAI 兼容端点，以 /v1 结尾）
        zh-Hant: LLM 介面位址（OpenAI 相容端點，以 /v1 結尾）
      required: false
      type: text

    # ============================================================
    # 备用 LLM：开 = openai，与主 LLM 共用提供商、Key、接口地址，只换模型
    # 关 = 留空：上游在 provider 为空时根本不创建该成员（Key 校验也不会触发）
    # ============================================================
    - default: ""
      envKey: HINDSIGHT_API_LLM_1_PROVIDER
      labelEn: Backup LLM
      labelZh: 备用 LLM
      label:
        en: "Backup LLM (optional) — on: openai, sharing the main LLM's key and endpoint; off: no backup model"
        zh: 备用 LLM（可选）—— 开：使用 openai，与主 LLM 共用 Key 与接口地址；关：不启用备用模型
        zh-Hant: 備用 LLM（可選）—— 開：使用 openai，與主 LLM 共用 Key 與介面位址；關：不啟用備用模型
      required: false
      type: select
      values:
        - label: 开启（openai，与主 LLM 同接口）
          value: openai
        - label: 关闭（不使用备用模型）
          value: ""

    - default: ""
      envKey: HINDSIGHT_API_LLM_1_MODEL
      labelEn: Backup LLM Model
      labelZh: 备用 LLM 模型
      label:
        en: Backup LLM Model — only used when the backup is switched on, where it is then required. Must be a model that endpoint serves, or a failover would fail too.
        zh: 备用 LLM 模型 —— 仅在备用开启时生效，开启后必填；必须是主 LLM 接口真实提供的模型，否则主模型出错切过去也会立刻失败
        zh-Hant: 備用 LLM 模型 —— 僅在備用開啟時生效，開啟後必填；必須是主 LLM 介面真實提供的模型，否則主模型出錯切過去也會立刻失敗
      required: false
      type: text

    # ============================================================
    # 嵌入模型：锁定硅基流动
    # 上游没有 siliconflow 这个嵌入提供商，这里走 OpenAI 兼容接口，
    # 接口地址已在 compose 中固定为 https://api.siliconflow.cn/v1
    # ============================================================
    - default: ""
      envKey: HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY
      labelEn: Embeddings API Key
      labelZh: 嵌入模型 API Key
      label:
        en: Embeddings API Key (your SiliconFlow API key)
        zh: 嵌入模型 API Key（硅基流动的 API Key）
        zh-Hant: 嵌入模型 API Key（矽基流動的 API Key）
      required: true
      type: password

    - default: BAAI/bge-m3
      envKey: HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL
      labelEn: Embeddings Model
      labelZh: 嵌入模型
      label:
        en: Embeddings Model (must exist in your SiliconFlow account; never change it once memories exist)
        zh: 嵌入模型（需存在于你的硅基流动账号中；写入记忆后不要更换，否则已有记忆要重新向量化）
        zh-Hant: 嵌入模型（需存在於你的矽基流動帳號中；寫入記憶後不要更換，否則已有記憶要重新向量化）
      required: true
      rule: paramCommon
      type: text

    - default: ""
      envKey: HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS
      labelEn: Embeddings Dimensions
      labelZh: 嵌入维度
      label:
        en: "Embeddings Dimensions (blank = the model's native width. SiliconFlow bge / Qwen models: keep blank — the parameter is only accepted by OpenAI text-embedding-3 models)"
        zh: 嵌入维度（留空 = 用模型原生维度。硅基流动的 bge / Qwen 系列请保持留空；该参数只有 OpenAI text-embedding-3 系列接受）
        zh-Hant: 嵌入維度（留空 = 用模型原生維度。矽基流動的 bge / Qwen 系列請保持留空；該參數只有 OpenAI text-embedding-3 系列接受）
      required: false
      type: text

    # ============================================================
    # 重排模型：锁定硅基流动（Cohere 兼容 /rerank，地址与能力都在 compose 里固定）
    # ============================================================
    - default: ""
      envKey: HINDSIGHT_API_RERANKER_SILICONFLOW_API_KEY
      labelEn: Reranker API Key
      labelZh: 重排模型 API Key
      label:
        en: Reranker API Key (your SiliconFlow API key)
        zh: 重排模型 API Key（硅基流动的 API Key）
        zh-Hant: 重排模型 API Key（矽基流動的 API Key）
      required: true
      type: password

    - default: BAAI/bge-reranker-v2-m3
      envKey: HINDSIGHT_API_RERANKER_SILICONFLOW_MODEL
      labelEn: Reranker Model
      labelZh: 重排模型
      label:
        en: Reranker Model (must exist in your SiliconFlow account; do not leave blank)
        zh: 重排模型（需存在于你的硅基流动账号中；不要留空）
        zh-Hant: 重排模型（需存在於你的矽基流動帳號中；不要留空）
      required: true
      rule: paramCommon
      type: text

    - default: 300
      envKey: HINDSIGHT_API_RERANKER_MAX_CANDIDATES
      labelEn: Reranker Max Candidates
      labelZh: 重排候选上限
      label:
        en: Reranker Max Candidates (how many fused candidates the reranker re-scores per recall)
        zh: 重排候选上限（每次召回交给重排模型精排的候选数）
        zh-Hant: 重排候選上限（每次召回交給重排模型精排的候選數）
      required: true
      type: number

    # ============================================================
    # 认证：API/MCP 用 API Key，GUI 用独立访问密钥
    # ============================================================
    - default: ""
      envKey: HINDSIGHT_API_TENANT_API_KEY
      labelEn: API / MCP Access Key
      labelZh: API / MCP 访问密钥
      label:
        en: API / MCP Access Key (clients send it as Authorization Bearer)
        zh: API / MCP 访问密钥（客户端以 Bearer 形式携带）
        zh-Hant: API / MCP 存取金鑰（客戶端以 Bearer 形式攜帶）
      random: true
      required: true
      type: password

    - default: ""
      envKey: HINDSIGHT_CP_ACCESS_KEY
      labelEn: GUI Access Key
      labelZh: GUI 访问密钥
      label:
        en: GUI Access Key (must differ from the API access key)
        zh: GUI 访问密钥（必须与 API 访问密钥不同）
        zh-Hant: GUI 存取金鑰（必須與 API 存取金鑰不同）
      random: true
      required: true
      type: password
