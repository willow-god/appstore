additionalProperties:
  formFields:
    # ============================================================
    # 数据库（PostgreSQL，需已安装 pgvector 扩展）
    # 数据库连接属于「安装时决定」的参数，不带 edit: true ——
    # 与官方应用一致（改库要重装，避免容器指向别的空库）
    # ============================================================
    - child:
        default: ""
        envKey: PANEL_DB_HOST
        required: true
        type: service
      default: postgresql
      envKey: PANEL_DB_TYPE
      labelEn: Database Service
      labelZh: 数据库服务
      label:
        en: Database Service
        zh: 数据库服务
        zh-Hant: 資料庫服務
      required: true
      type: apps
      values:
        - label: PostgreSQL
          value: postgresql

    - default: hindsight
      envKey: PANEL_DB_NAME
      labelEn: Database Name
      labelZh: 数据库名
      label:
        en: Database Name
        zh: 数据库名
        zh-Hant: 資料庫名
      random: true
      required: true
      rule: paramCommon
      type: text

    - default: hindsight
      envKey: PANEL_DB_USER
      labelEn: Database User
      labelZh: 数据库用户
      label:
        en: Database User
        zh: 数据库用户
        zh-Hant: 資料庫使用者
      random: true
      required: true
      rule: paramCommon
      type: text

    - default: hindsight
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: Database User Password
      labelZh: 数据库用户密码
      label:
        en: Database User Password
        zh: 数据库用户密码
        zh-Hant: 資料庫使用者密碼
      random: true
      required: true
      type: password

    # ============================================================
    # 端口：控制台(GUI) / 数据面 API
    # ============================================================
    - default: 9999
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Control Plane (GUI) Port
      labelZh: 控制台(GUI)端口
      label:
        en: Control Plane (GUI) Port
        zh: 控制台(GUI)端口
        zh-Hant: 控制台(GUI)連接埠
      required: true
      rule: paramPort
      type: number

    - default: 8888
      edit: true
      envKey: PANEL_APP_PORT_API
      labelEn: Dataplane API Port
      labelZh: 数据面 API 端口
      label:
        en: Dataplane API Port
        zh: 数据面 API 端口
        zh-Hant: 資料面 API 連接埠
      required: true
      rule: paramPort
      type: number

    # ============================================================
    # 模型类字段分 5 组，组号同时写进 label 和下面的注释：
    # 安装表单是平铺的、没有分组控件，label 里的编号是用户在界面上
    # 分辨「哪几项是一组」的唯一手段；注释用同一个编号方便对照。
    # 数据库 / 端口 / 访问密钥含义自明，不编号，组号从主 LLM 起算。
    # 组内一律按「接口地址 → 模型 → Key」排列，与使用顺序一致。
    # 注意：模型名与接口地址都不要加 rule —— paramCommon 的正则
    # /^[a-zA-Z0-9][a-zA-Z0-9._-]{1,63}$/ 不接受斜杠，而 "厂商/模型"
    # （qwen/qwen3-embedding-4b 等）是常见写法。不写 rule 只校验非空。
    # ============================================================

    # 1. 主 LLM：提供商已在 compose 中固定为 openai（OpenAI 兼容协议）
    - default: "https://api.openai.com/v1"
      edit: true
      envKey: HINDSIGHT_API_LLM_BASE_URL
      labelEn: 1. Main LLM Base URL
      labelZh: 1. 主 LLM 接口地址
      label:
        en: 1. Main LLM Base URL
        zh: 1. 主 LLM 接口地址
        zh-Hant: 1. 主 LLM 介面位址
      required: false
      type: text

    - default: ""
      edit: true
      envKey: HINDSIGHT_API_LLM_MODEL
      labelEn: 1. Main LLM Model
      labelZh: 1. 主 LLM 模型
      label:
        en: 1. Main LLM Model
        zh: 1. 主 LLM 模型
        zh-Hant: 1. 主 LLM 模型
      required: true
      type: text

    - default: ""
      edit: true
      envKey: HINDSIGHT_API_LLM_API_KEY
      labelEn: 1. Main LLM API Key
      labelZh: 1. 主 LLM API Key
      label:
        en: 1. Main LLM API Key
        zh: 1. 主 LLM API Key
        zh-Hant: 1. 主 LLM API Key
      required: true
      type: password

    # 2. 备用 LLM：主 LLM 报错时按顺序故障转移。
    # 开关关闭时 provider 为空，上游在读取 API Key 之前就停止扫描，
    # 该成员根本不存在（因此也不会触发 Key 非空的强校验）。
    # 接口地址与 API Key 留空时，由 compose 回落到主 LLM 的同名变量。
    - default: ""
      edit: true
      envKey: HINDSIGHT_API_LLM_1_PROVIDER
      labelEn: 2. Backup LLM Switch
      labelZh: 2. 备用 LLM 开关
      label:
        en: 2. Backup LLM Switch
        zh: 2. 备用 LLM 开关
        zh-Hant: 2. 備用 LLM 開關
      required: false
      type: select
      values:
        - label: 开启（openai）
          value: openai
        - label: 关闭
          value: ""

    - default: ""
      description:
        en: Empty = same as main LLM
        zh: 留空 = 跟随主 LLM
        zh-Hant: 留空 = 跟隨主 LLM
      edit: true
      envKey: HINDSIGHT_API_LLM_1_BASE_URL
      labelEn: 2. Backup LLM Base URL
      labelZh: 2. 备用 LLM 接口地址
      label:
        en: 2. Backup LLM Base URL
        zh: 2. 备用 LLM 接口地址
        zh-Hant: 2. 備用 LLM 介面位址
      required: false
      type: text

    - default: ""
      description:
        en: Required when the backup is on
        zh: 开关开启后必填
        zh-Hant: 開關開啟後必填
      edit: true
      envKey: HINDSIGHT_API_LLM_1_MODEL
      labelEn: 2. Backup LLM Model
      labelZh: 2. 备用 LLM 模型
      label:
        en: 2. Backup LLM Model
        zh: 2. 备用 LLM 模型
        zh-Hant: 2. 備用 LLM 模型
      required: false
      type: text

    - default: ""
      description:
        en: Empty = same as main LLM
        zh: 留空 = 跟随主 LLM
        zh-Hant: 留空 = 跟隨主 LLM
      edit: true
      envKey: HINDSIGHT_API_LLM_1_API_KEY
      labelEn: 2. Backup LLM API Key
      labelZh: 2. 备用 LLM API Key
      label:
        en: 2. Backup LLM API Key
        zh: 2. 备用 LLM API Key
        zh-Hant: 2. 備用 LLM API Key
      required: false
      type: password

    # 3. 嵌入模型：已在 compose 中锁定硅基流动（OpenAI 兼容通道）
    - default: ""
      edit: true
      envKey: HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY
      labelEn: 3. Embeddings API Key
      labelZh: 3. 嵌入模型 API Key
      label:
        en: 3. Embeddings API Key
        zh: 3. 嵌入模型 API Key
        zh-Hant: 3. 嵌入模型 API Key
      required: true
      type: password

    - default: BAAI/bge-m3
      edit: true
      envKey: HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL
      labelEn: 3. Embeddings Model
      labelZh: 3. 嵌入模型
      label:
        en: 3. Embeddings Model
        zh: 3. 嵌入模型
        zh-Hant: 3. 嵌入模型
      required: true
      type: text

    - default: ""
      edit: true
      envKey: HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS
      labelEn: 3. Embeddings Dimensions
      labelZh: 3. 嵌入维度
      label:
        en: 3. Embeddings Dimensions
        zh: 3. 嵌入维度
        zh-Hant: 3. 嵌入維度
      required: false
      type: text

    # 4. 重排模型：已在 compose 中锁定硅基流动（Cohere 兼容的 /rerank）
    - default: ""
      edit: true
      envKey: HINDSIGHT_API_RERANKER_SILICONFLOW_API_KEY
      labelEn: 4. Reranker API Key
      labelZh: 4. 重排模型 API Key
      label:
        en: 4. Reranker API Key
        zh: 4. 重排模型 API Key
        zh-Hant: 4. 重排模型 API Key
      required: true
      type: password

    - default: BAAI/bge-reranker-v2-m3
      edit: true
      envKey: HINDSIGHT_API_RERANKER_SILICONFLOW_MODEL
      labelEn: 4. Reranker Model
      labelZh: 4. 重排模型
      label:
        en: 4. Reranker Model
        zh: 4. 重排模型
        zh-Hant: 4. 重排模型
      required: true
      type: text

    - default: 300
      edit: true
      envKey: HINDSIGHT_API_RERANKER_MAX_CANDIDATES
      labelEn: 4. Reranker Max Candidates
      labelZh: 4. 重排候选上限
      label:
        en: 4. Reranker Max Candidates
        zh: 4. 重排候选上限
        zh-Hant: 4. 重排候選上限
      required: true
      type: number

    # ============================================================
    # 5. 通用配置：与具体模型无关的应用级设置，所以放在所有模型组之后
    # · 全局 LLM 并发：管整个 LLM 栈同时在跑多少请求，主 / 备用 LLM
    #   一起受它限制（嵌入与重排不走这条路，不受影响）
    # · 访问密钥：API/MCP 用 API Key，GUI 用独立访问密钥
    # ============================================================
    - default: 4
      edit: true
      envKey: HINDSIGHT_API_LLM_MAX_CONCURRENT
      labelEn: 5. Global LLM Concurrency
      labelZh: 5. 全局 LLM 并发
      label:
        en: 5. Global LLM Concurrency
        zh: 5. 全局 LLM 并发
        zh-Hant: 5. 全域 LLM 並發
      required: true
      type: number

    - default: ""
      edit: true
      envKey: HINDSIGHT_API_TENANT_API_KEY
      labelEn: API / MCP Access Key
      labelZh: API / MCP 访问密钥
      label:
        en: API / MCP Access Key
        zh: API / MCP 访问密钥
        zh-Hant: API / MCP 存取金鑰
      random: true
      required: true
      type: password

    - default: ""
      edit: true
      envKey: HINDSIGHT_CP_ACCESS_KEY
      labelEn: GUI Access Key
      labelZh: GUI 访问密钥
      label:
        en: GUI Access Key
        zh: GUI 访问密钥
        zh-Hant: GUI 存取金鑰
      random: true
      required: true
      type: password
