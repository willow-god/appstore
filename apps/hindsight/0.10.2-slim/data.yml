additionalProperties:
  formFields:
    # ============================================================
    # PostgreSQL（需已安装 pgvector 扩展）
    # ============================================================
    - child:
        default: ""
        envKey: PANEL_DB_HOST
        required: true
        type: service
      default: postgresql
      envKey: PANEL_DB_TYPE
      labelEn: Database Service
      labelZh: 数据库服务
      label:
        en: Database Service
        zh: 数据库服务
        zh-Hant: 資料庫服務
      required: true
      type: apps
      values:
        - label: PostgreSQL
          value: postgresql

    - default: hindsight
      envKey: PANEL_DB_NAME
      labelEn: Database Name
      labelZh: 数据库名
      label:
        en: Database Name
        zh: 数据库名
        zh-Hant: 資料庫名
      random: true
      required: true
      rule: paramCommon
      type: text

    - default: hindsight
      envKey: PANEL_DB_USER
      labelEn: Database User
      labelZh: 数据库用户
      label:
        en: Database User
        zh: 数据库用户
        zh-Hant: 資料庫使用者
      random: true
      required: true
      rule: paramCommon
      type: text

    - default: hindsight
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: Database User Password
      labelZh: 数据库用户密码
      label:
        en: Database User Password
        zh: 数据库用户密码
        zh-Hant: 資料庫使用者密碼
      random: true
      required: true
      type: password

    # ============================================================
    # 端口：控制台(GUI) / 数据面 API
    # ============================================================
    - default: 9999
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Control Plane (GUI) Port
      labelZh: 控制台(GUI)端口
      label:
        en: Control Plane (GUI) Port
        zh: 控制台(GUI)端口
        zh-Hant: 控制台(GUI)連接埠
      required: true
      rule: paramPort
      type: number

    - default: 8888
      envKey: PANEL_APP_PORT_API
      labelEn: Dataplane API Port
      labelZh: 数据面 API 端口
      label:
        en: Dataplane API Port
        zh: 数据面 API 端口
        zh-Hant: 資料面 API 連接埠
      required: true
      rule: paramPort
      type: number

    # ============================================================
    # 主 LLM：全部操作默认使用
    # ============================================================
    - default: openai
      envKey: HINDSIGHT_API_LLM_PROVIDER
      labelEn: LLM Provider
      labelZh: LLM 提供商
      label:
        en: "LLM Provider (openai / anthropic / gemini / deepseek / zai / groq / ollama ...)"
        zh: LLM 提供商（openai / anthropic / gemini / deepseek / zai / groq / ollama ...）
        zh-Hant: LLM 供應商（openai / anthropic / gemini / deepseek / zai / groq / ollama ...）
      required: true
      rule: paramCommon
      type: text

    - default: ""
      envKey: HINDSIGHT_API_LLM_API_KEY
      labelEn: LLM API Key
      labelZh: LLM API Key
      label:
        en: LLM API Key
        zh: LLM API Key
        zh-Hant: LLM API Key
      required: true
      type: password

    - default: ""
      envKey: HINDSIGHT_API_LLM_MODEL
      labelEn: LLM Model
      labelZh: LLM 模型
      label:
        en: LLM Model (blank = the provider's default model)
        zh: LLM 模型（留空使用该提供商默认模型）
        zh-Hant: LLM 模型（留空使用該供應商預設模型）
      required: false
      type: text

    - default: ""
      envKey: HINDSIGHT_API_LLM_BASE_URL
      labelEn: LLM Base URL
      labelZh: LLM 接口地址
      label:
        en: LLM Base URL (OpenAI-compatible endpoint, ending in /v1)
        zh: LLM 接口地址（OpenAI 兼容端点，以 /v1 结尾）
        zh-Hant: LLM 介面位址（OpenAI 相容端點，以 /v1 結尾）
      required: false
      type: text

    - default: 64000
      envKey: HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS
      labelEn: Retain Max Output Tokens
      labelZh: Retain 最大输出 Token
      label:
        en: Retain Max Output Tokens (must exceed 3000; upstream needs 65k-capable models by default, lower it for smaller ones)
        zh: Retain 最大输出 Token（必须大于 3000；默认要求模型可输出 65k，模型上限较小时请调低）
        zh-Hant: Retain 最大輸出 Token（必須大於 3000；預設要求模型可輸出 65k，模型上限較小時請調低）
      required: true
      type: number

    # ============================================================
    # 备用 LLM：主模型失败时按顺序切换（failover）
    # 整组留空 = 不启用备用模型
    # ============================================================
    - default: ""
      envKey: HINDSIGHT_API_LLM_1_PROVIDER
      labelEn: Backup LLM Provider
      labelZh: 备用 LLM 提供商
      label:
        en: Backup LLM Provider (blank = no backup model)
        zh: 备用 LLM 提供商（留空则不启用备用模型）
        zh-Hant: 備用 LLM 供應商（留空則不啟用備用模型）
      required: false
      type: text

    - default: ""
      envKey: HINDSIGHT_API_LLM_1_API_KEY
      labelEn: Backup LLM API Key
      labelZh: 备用 LLM API Key
      label:
        en: Backup LLM API Key (required once a Backup Provider is set, or the container fails to start)
        zh: 备用 LLM API Key（填了上面的提供商就必填，否则容器启动即失败）
        zh-Hant: 備用 LLM API Key（填了上面的供應商就必填，否則容器啟動即失敗）
      required: false
      type: password

    - default: ""
      envKey: HINDSIGHT_API_LLM_1_MODEL
      labelEn: Backup LLM Model
      labelZh: 备用 LLM 模型
      label:
        en: Backup LLM Model (blank = the provider's default model)
        zh: 备用 LLM 模型（留空使用该提供商默认模型）
        zh-Hant: 備用 LLM 模型（留空使用該供應商預設模型）
      required: false
      type: text

    - default: ""
      envKey: HINDSIGHT_API_LLM_1_BASE_URL
      labelEn: Backup LLM Base URL
      labelZh: 备用 LLM 接口地址
      label:
        en: Backup LLM Base URL (blank = the provider's own default endpoint, it does NOT inherit the main LLM's URL)
        zh: 备用 LLM 接口地址（留空用该提供商默认地址，不会继承主 LLM 的地址）
        zh-Hant: 備用 LLM 介面位址（留空用該供應商預設位址，不會繼承主 LLM 的位址）
      required: false
      type: text

    # ============================================================
    # 嵌入模型（slim 镜像不含本地模型，必须用 OpenAI 兼容接口）
    # ============================================================
    - default: ""
      envKey: HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY
      labelEn: Embeddings API Key
      labelZh: 嵌入模型 API Key
      label:
        en: Embeddings API Key (blank = reuse the LLM API key)
        zh: 嵌入模型 API Key（留空复用主 LLM 的 Key）
        zh-Hant: 嵌入模型 API Key（留空複用主 LLM 的 Key）
      required: false
      type: password

    - default: ""
      envKey: HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL
      labelEn: Embeddings Base URL
      labelZh: 嵌入模型接口地址
      label:
        en: Embeddings Base URL (OpenAI-compatible, ending in /v1; blank = the LLM base URL)
        zh: 嵌入模型接口地址（OpenAI 兼容，以 /v1 结尾；留空沿用主 LLM 地址）
        zh-Hant: 嵌入模型介面位址（OpenAI 相容，以 /v1 結尾；留空沿用主 LLM 位址）
      required: false
      type: text

    - default: text-embedding-3-small
      envKey: HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL
      labelEn: Embeddings Model
      labelZh: 嵌入模型
      label:
        en: Embeddings Model (never change it after memories exist — they must be re-embedded)
        zh: 嵌入模型（写入记忆后不要更换，否则已有记忆需要重新向量化）
        zh-Hant: 嵌入模型（寫入記憶後不要更換，否則已有記憶需要重新向量化）
      required: true
      rule: paramCommon
      type: text

    - default: ""
      envKey: HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS
      labelEn: Embeddings Dimensions
      labelZh: 嵌入维度
      label:
        en: "Embeddings Dimensions (blank = model native; only models supporting a dimensions parameter accept it)"
        zh: 嵌入维度（留空用模型原生维度；只有支持 dimensions 参数的模型才可填写）
        zh-Hant: 嵌入維度（留空用模型原生維度；只有支援 dimensions 參數的模型才可填寫）
      required: false
      type: text

    # ============================================================
    # 重排（slim 镜像无法使用本地 cross-encoder）
    # ============================================================
    - default: rrf
      envKey: HINDSIGHT_API_RERANKER_PROVIDER
      labelEn: Reranker Provider
      labelZh: 重排方式
      label:
        en: Reranker Provider (rrf = fusion order only; no external service needed)
        zh: 重排方式（rrf = 仅用融合排序，无需外部服务）
        zh-Hant: 重排方式（rrf = 僅用融合排序，無需外部服務）
      required: true
      type: select
      values:
        - label: RRF 融合排序（无需外部服务）
          value: rrf
        - label: 关闭重排
          value: none

    - default: 300
      envKey: HINDSIGHT_API_RERANKER_MAX_CANDIDATES
      labelEn: Reranker Max Candidates
      labelZh: 重排候选上限
      label:
        en: Reranker Max Candidates (only applies to a neural reranker; inert while the provider is rrf)
        zh: 重排候选上限（仅对神经重排生效；重排方式为 rrf 时不生效）
        zh-Hant: 重排候選上限（僅對神經重排生效；重排方式為 rrf 時不生效）
      required: true
      type: number

    # ============================================================
    # 认证：API/MCP 用 API Key，GUI 用独立访问密钥
    # ============================================================
    - default: ""
      envKey: HINDSIGHT_API_TENANT_API_KEY
      labelEn: API / MCP Access Key
      labelZh: API / MCP 访问密钥
      label:
        en: API / MCP Access Key (clients send it as Authorization Bearer)
        zh: API / MCP 访问密钥（客户端以 Bearer 形式携带）
        zh-Hant: API / MCP 存取金鑰（客戶端以 Bearer 形式攜帶）
      random: true
      required: true
      type: password

    - default: ""
      envKey: HINDSIGHT_CP_ACCESS_KEY
      labelEn: GUI Access Key
      labelZh: GUI 访问密钥
      label:
        en: GUI Access Key (must differ from the API access key)
        zh: GUI 访问密钥（必须与 API 访问密钥不同）
        zh-Hant: GUI 存取金鑰（必須與 API 存取金鑰不同）
      random: true
      required: true
      type: password
