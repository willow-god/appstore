  description:
    en: Hindsight is a self-hosted memory system for AI agents. It extracts facts, entities and relationships from conversations and documents into PostgreSQL, retrieves them with semantic, keyword, temporal and graph search, and answers questions over them through a reflect pipeline. A built-in control plane provides the management UI.
    zh: Hindsight 是一个面向 AI Agent 的可自托管记忆系统，把对话与文档中的事实、实体和关系抽取到 PostgreSQL，并通过语义、关键词、时间与图检索召回，再经由反思流程作答；内置控制台提供可视化管理界面。
    zh-Hant: Hindsight 是一個面向 AI Agent 的可自架記憶系統，將對話與文件中的事實、實體和關係抽取到 PostgreSQL，並透過語意、關鍵詞、時間與圖檢索召回，再經由反思流程作答；內建控制台提供視覺化管理介面。
