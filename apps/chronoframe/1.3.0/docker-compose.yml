services:
  chronoframe:
    image: ghcr.io/hoshinosuzumi/chronoframe:1.3.1
    container_name: ${CONTAINER_NAME}
    restart: always
    labels:
      createdBy: "Apps"
    ports:
      - "${PANEL_APP_PORT_HTTP}:3000"
    volumes:
      # SQLite 数据库 app.sqlite3、自动生成的会话密钥 .session-password 和本地存储的照片
      # 都在 /app/data 下，升级镜像只替换容器，这些数据不会丢；备份应用目录即可备份相册。
      - ./data:/app/data
    environment:
      # 1.0 起管理员、站点、存储、地图等设置全部在首次访问的设置向导和后台维护，
      # 旧版的 CFRAME_ADMIN_* / NUXT_* 环境变量已不再需要，这里不再注入。
      # 部署侧唯一保留的开关是 NUXT_TRUST_PROXY（默认 false）：
      # 只有 3000 端口仅能被可信代理访问、且代理会覆盖 X-Forwarded-For 时才需要改成 "true"，
      # 用法见 https://github.com/HoshinoSuzumi/chronoframe 的快速开始文档。
      TZ: Asia/Shanghai
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
